name: Build Android APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK as a release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PixelPlanner.apk
          VER=$(grep -oP "versionName '\K[^']+" app/build.gradle)
          { echo "Version v$VER"; echo; cat RELEASE_NOTES.md; echo; echo "Download PixelPlanner.apk and install it on your Android phone."; } > /tmp/notes.md
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest PixelPlanner.apk --target "${{ github.sha }}" --title "Pixel Planner v$VER" --notes-file /tmp/notes.md
