plugins {
    id 'com.android.application'
}

android {
    namespace 'app.pixelplanner'
    compileSdk 35

    defaultConfig {
        applicationId 'app.pixelplanner.ravi'
        minSdk 26
        targetSdk 35
        versionCode 37
        versionName '3.16'
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
